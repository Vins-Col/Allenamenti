<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis HUD – Allenamenti</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>

  <header class="hud-title">IRON HUD – ALLENAMENTI</header>

  <section class="panel">
    <h2 class="panel-title" onclick="togglePanel('obiettivi')">🎯 OBIETTIVI (LIVE)</h2>
    <div id="obiettivi" class="panel-content">
      <div class="metric">Riduzione pancia <span class="bar" data-value="80"></span></div>
      <div class="metric">Tonificazione gambe <span class="bar" data-value="60"></span></div>
      <div class="metric">Fiato/resistenza <span class="bar" data-value="40"></span></div>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title" onclick="togglePanel('regole')">⚡ REGOLE BASE</h2>
    <div id="regole" class="panel-content">
      <p>Durata max: 40–45 min</p>
      <p>Pendenza: 0% / 11%</p>
      <p>Velocità: 2–12 km/h</p>
      <p>Se facile: +3% velocità</p>
      <p>Se dura: –5% velocità</p>
      <p>Addome sempre attivo</p>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title" onclick="togglePanel('settimane')">📅 PROGRAMMA SETTIMANALE</h2>
    <div id="settimane" class="panel-content">
      <button class="week-btn" onclick="openWeek(1)">Settimana 1</button>
      <button class="week-btn" onclick="openWeek(2)">Settimana 2</button>
      <button class="week-btn" onclick="openWeek(3)">Settimana 3</button>
      <button class="week-btn" onclick="openWeek(4)">Settimana 4</button>
      <button class="week-btn" onclick="openWeek(5)">Settimana 5</button>
      <button class="week-btn" onclick="openWeek(6)">Settimana 6</button>
    </div>
  </section>

  <section id="week-details" class="panel hidden">
    <h2 id="week-title"></h2>
    <div id="week-content"></div>
    <button class="close-btn" onclick="closeWeek()">Chiudi</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
